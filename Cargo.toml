[package]
name = "bloop-box"
description = "Bloop Box Client"
version = "5.1.0"
authors = ["Ben Scholzen (DASPRiD) <mail@dasprids.de>"]
edition = "2021"
readme = "README.md"
license-file = "LICENSE"

[features]
default = ["hardware"]
hardware-emulation = ["dep:eframe", "dep:egui"]
hardware = [
    "dep:aw2013",
    "dep:gpiocdev",
    "dep:linux-embedded-hal",
    "bloop-client-framework/nfc-mfrc522",
]
with-bindgen = ["dep:aws-lc-sys"]

[dependencies]
anyhow = "1.0.104"
bloop-client-framework = { version = "1", features = [
    "audio",
    "nfc",
    "tokio-graceful-shutdown",
] }
bloop-protocol = { version = "1.2", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-graceful-shutdown = "0.20.0"
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
serde_json = "1.0.151"
thiserror = "2.0.19"
hex = { version = "0.4.3", features = ["serde"] }
linux-embedded-hal = { version = "0.4.1", features = ["async-tokio", "i2c", "i2cdev"], default-features = false, optional = true }
aw2013 = { version = "2.1.0", optional = true }
rand_distr = "0.6.0"
regex = "1.13.1"
tracing = "0.1.44"
eframe = { version = "0.35.0", optional = true }
egui = { version = "0.35.0", optional = true }
gpiocdev = { version = "0.8.0", features = ["async_tokio"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = "0.7.19"
directories = { version = "6.0.0" }
# Not referenced directly; unifies the crypto-provider features and
# carries the with-bindgen path to aws-lc-sys.
rustls = "0.23.42"
include_dir = "0.7.4"
aws-lc-sys = { version = "0.43", optional = true, features = ["bindgen"] }

[profile.release]
strip = "debuginfo"

[package.metadata.deb]
depends = "adduser, bloop-box-data, ca-certificates, systemd, network-manager"
conf-files = ["/etc/bloop-box.conf"]
maintainer-scripts = "debian/"
systemd-units = { enable = true }
extended-description = """\
Bloop Box client for sending bloops to a server.\
"""
section = "games"
priority = "optional"
assets = [
    ["target/bloop-box", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/bloop-box/", "644"],
    ["etc/bloop-box.conf", "etc/", "644"],
    ["etc/011_bloop-box", "etc/sudoers.d/", "440"],
    ["etc/99-systemd-spidev.rules", "lib/udev/rules.d/", "644"]
]
